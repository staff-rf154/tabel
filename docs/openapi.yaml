openapi: 3.1.0
info:
  title: Tabel API
  description: >-
    REST API системы табелирования сотрудников «Табель» (QR-учёт рабочего времени).
    Аутентификация — JWT (access/refresh) для пользователей и OAuth 2.0
    client_credentials для внешних систем выгрузки и интеграции с 1С.
    Часовой пояс бизнес-логики, графиков и отчётов — Asia/Novosibirsk (UTC+7).
    Время в API передаётся в RFC3339; серверные метки содержат часовой пояс.
  version: 1.3.0
  contact:
    name: Табель
servers:
  - url: https://srv.staff-rf.ru/api
    description: Production (HTTPS)
  - url: http://localhost:8080
    description: Локальная разработка
tags:
  - name: system
    description: Служебные эндпоинты
  - name: setup
    description: Первичная установка и настройка (SQLite)
  - name: auth
    description: Аутентификация и профиль
  - name: marks
    description: Отметки сотрудников
  - name: schedules
    description: Графики работы
  - name: qr
    description: QR-токены (статические и бумажные)
  - name: delegations
    description: Делегирование прав оператора
  - name: notifications
    description: Уведомления
  - name: mobile
    description: Мобильное приложение (серверная конфигурация интерфейса и статистика сотрудника)
  - name: audit
    description: Журнал аудита
  - name: admin
    description: Администрирование
  - name: export
    description: Выгрузка для внешних систем
  - name: oauth
    description: OAuth 2.0 (client_credentials)
  - name: integration-1c
    description: Обмен справочниками и отметками с 1С:УПП и 1С:ЗУП (OAuth client_credentials)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Проверка работоспособности сервиса (liveness)
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Сервис работает
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /ready:
    get:
      tags: [system]
      summary: Проверка готовности (БД и Redis)
      operationId: getReady
      security: []
      responses:
        "200":
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ready }
        "503":
          description: Одна из зависимостей недоступна или система не настроена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadyError" }

  /setup/status:
    get:
      tags: [setup]
      summary: Состояние первичной установки
      operationId: getSetupStatus
      security: []
      responses:
        "200":
          description: Текущее состояние
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SetupStatus" }
  /setup/test-db:
    post:
      tags: [setup]
      summary: Проверить подключение, создать БД и структуру при необходимости
      operationId: testDatabase
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [database_url]
              properties:
                database_url: { type: string, example: "postgres://tabel:secret@pgbouncer:5432/tabel?sslmode=disable" }
      responses:
        "200":
          description: Подключение успешно, структура БД готова
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  database_created: { type: boolean, example: false }
                  schema_ready: { type: boolean, example: true }
        "400":
          description: Не удалось подключиться
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Система уже установлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /setup/save:
    post:
      tags: [setup]
      summary: Сохранить параметры подключения и применить миграции
      operationId: saveSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupParams" }
      responses:
        "200":
          description: Параметры сохранены, миграции применены
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: saved }
                  migrated: { type: boolean, example: true }
        "400":
          description: Некорректные параметры или БД недоступна
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Система уже установлена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /setup/complete:
    post:
      tags: [setup]
      summary: Завершить установку и зафиксировать профиль администратора
      operationId: completeSetup
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                main_admin_email: { type: string, format: email }
                support_phone: { type: string }
                admin_login: { type: string, description: Логин главного администратора (необязательно) }
                admin_password: { type: string, minLength: 5, description: Пароль главного администратора (необязательно) }
      responses:
        "200":
          description: Установка завершена
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: installed }
        "409":
          description: Система уже установлена или подключение не настроено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      summary: Вход по логину и паролю
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Токены доступа
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Неверные учётные данные
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "423":
          description: Авторизация запрещена (заблокирован), возвращается телефон поддержки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BlockedError" }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Обновить access-токен
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401":
          description: Refresh-токен недействителен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: Выход (отзыв сессии)
      operationId: logout
      responses:
        "204": { description: Сессия завершена }
  /auth/register:
    post:
      tags: [auth]
      summary: Регистрация сотрудника по QR-токену
      operationId: registerByQR
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token, full_name, phone, password]
              properties:
                qr_token: { type: string, format: uuid }
                signature: { type: string }
                full_name: { type: string }
                phone: { type: string }
                password: { type: string, minLength: 5 }
      responses:
        "201":
          description: Учётная запись создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }
        "400":
          description: Некорректные данные или подпись QR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Учётная запись уже зарегистрирована
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: QR-токен отозван или истёк
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/password:
    post:
      tags: [auth]
      summary: Сменить собственный пароль
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 5 }
      responses:
        "204": { description: Пароль изменён }
        "400":
          description: Пароль не соответствует политике
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /me:
    get:
      tags: [auth]
      summary: Профиль текущего пользователя
      operationId: getMe
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserProfile" }

  /me/monthly-stats:
    get:
      tags: [mobile, marks]
      summary: Статистика сотрудника за текущий календарный месяц
      description: >-
        Возвращает количество отработанных дней и минут по сменам, число смен и
        последние входы сотрудника за календарный месяц (Asia/Novosibirsk).
      operationId: getMyMonthlyStats
      responses:
        "200":
          description: Статистика за месяц
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyStats" }
        "404":
          description: Пользователь не привязан к сотруднику
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /mobile/bootstrap:
    get:
      tags: [mobile]
      summary: Конфигурация мобильного интерфейса для текущей роли
      description: >-
        Сервер формирует навигацию и набор функций для роли пользователя.
        Клиент сохраняет конфигурацию в защищённом хранилище до выхода из
        учётной записи. Экраны остаются нативными, JSON управляет их составом.
      operationId: getMobileBootstrap
      responses:
        "200":
          description: Конфигурация интерфейса
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileBootstrap" }

  /me/qr:
    get:
      tags: [qr]
      summary: Личный бессрочный QR сотрудника (создаётся автоматически)
      operationId: getMyQR
      responses:
        "200":
          description: Активный QR-токен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QRToken" }
  /me/qr/rotate:
    post:
      tags: [qr]
      summary: Сменить личный QR; старый отзывается с причиной «изменён сотрудником»
      operationId: rotateMyQR
      responses:
        "201":
          description: Новый QR-токен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QRToken" }
  /me/qr.png:
    get:
      tags: [qr]
      summary: PNG с личным QR-кодом
      operationId: getMyQRImage
      responses:
        "200":
          description: Изображение PNG
          content:
            image/png:
              schema: { type: string, format: binary }
  /mark:
    post:
      tags: [marks]
      summary: Создать отметку (вход/выход)
      operationId: createMark
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkCreate" }
      responses:
        "201":
          description: Отметка создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mark" }
        "200":
          description: Повторная доставка (идемпотентность) — возвращается ранее созданная отметка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Mark" }
        "422":
          description: Недопустимый переход (invalid_transition)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /marks:
    get:
      tags: [marks]
      summary: Список отметок текущего сотрудника
      operationId: listMyMarks
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: Отметки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mark" }

  /schedules:
    get:
      tags: [schedules]
      summary: Активный график текущего сотрудника
      description: Если график не задан, возвращается график по умолчанию 5/2, 09:00–18:00.
      operationId: getMySchedule
      responses:
        "200":
          description: Активный график или график по умолчанию
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404":
          description: Пользователь не привязан к сотруднику
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /qr/{token}:
    get:
      tags: [qr]
      summary: Проверить QR-токен (подпись + статус + сверка полей)
      operationId: verifyQr
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Результат проверки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrVerification" }
        "404":
          description: Токен не найден (token_status = not_found)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrVerification" }

  /delegations:
    get:
      tags: [delegations]
      summary: Список делегирований
      operationId: listDelegations
      responses:
        "200":
          description: Делегирования
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Delegation" }
    post:
      tags: [delegations]
      summary: Запросить передачу прав оператора
      operationId: createDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [valid_until]
              properties:
                to_user_id: { type: string, format: uuid, description: Устаревший способ; используйте to_login. }
                to_login: { type: string, description: Логин сотрудника, сгенерированный автоматически (ФамилияИ). }
                valid_until: { type: string, format: date-time }
      responses:
        "201":
          description: Запрос создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delegation" }
  /delegations/{id}/approve:
    post:
      tags: [delegations]
      summary: Подтвердить делегирование (администратор)
      operationId: approveDelegation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Подтверждено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delegation" }
  /delegations/{id}/reject:
    post:
      tags: [delegations]
      summary: Отклонить делегирование (администратор)
      operationId: rejectDelegation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Отклонено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delegation" }
  /delegations/{id}/revoke:
    post:
      tags: [delegations]
      summary: Досрочно отозвать делегирование
      operationId: revokeDelegation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Отозвано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Delegation" }

  /notifications:
    get:
      tags: [notifications]
      summary: Список уведомлений текущего пользователя
      operationId: listNotifications
      parameters:
        - { name: unread_only, in: query, schema: { type: boolean, default: false } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: Уведомления
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Notification" }
  /notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Отметить уведомление прочитанным
      operationId: readNotification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Отмечено }

  /admin/employees:
    get:
      tags: [admin]
      summary: Справочник сотрудников
      description: >
        Сотрудник — центральная сущность учёта. Содержит табельный номер,
        части ФИО (last_name, first_name, middle_name), вычисляемое full_name,
        контакты, отдел (department_id), должность (position_id), даты приёма и
        увольнения, признак активности. Должность хранится только ссылкой на
        справочник positions; свободный текст position не принимается.
        Поиск q ищет по ФИО, табельному номеру, телефону и email.
      operationId: listEmployees
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Список сотрудников
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      tags: [admin]
      summary: Создать сотрудника
      operationId: createEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
  /admin/employees/{id}:
    get:
      tags: [admin]
      summary: Карточка сотрудника
      operationId: getEmployee
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Сотрудник
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
    patch:
      tags: [admin]
      summary: Изменить сотрудника
      operationId: updateEmployee
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "200":
          description: Обновлён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }

  /admin/employees/{id}/qr:
    get:
      tags: [qr]
      summary: Получить личный статический QR сотрудника
      description: >
        Если активного статического QR нет, сервер создаёт его автоматически.
        Повторный вызов возвращает существующий токен без ротации.
      operationId: getEmployeeQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: QR-токен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrToken" }
        "404": { description: Сотрудник не найден }
        "409": { description: Сотрудник деактивирован }
  /admin/employees/{id}/qr.png:
    get:
      tags: [qr]
      summary: Получить PNG личного QR сотрудника
      description: Возвращает PNG QR-кода. При отсутствии активного токена сначала создаёт его.
      operationId: getEmployeeQrPng
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: PNG-изображение
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Сотрудник не найден }
        "409": { description: Сотрудник деактивирован }
  /admin/employees/{id}/qr/rotate:
    post:
      tags: [qr]
      summary: Принудительно сменить личный QR сотрудника
      description: Старый статический QR отзывается, создаётся новый.
      operationId: rotateEmployeeQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Новый QR-токен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrToken" }
        "404": { description: Сотрудник не найден }
        "409": { description: Сотрудник деактивирован }

  /admin/schedules:
    get:
      tags: [admin]
      summary: Графики работы
      description: >
        График задаёт паттерн (5/2, 2/2, 4/2, 1/2, custom), рабочие дни 1–7, время начала
        и окончания, период действия. Локальное время и границы смен считаются
        в Asia/Novosibirsk (UTC+7). Активный график — запись, действующая на
        текущую дату; при отсутствии используется 5/2, 09:00–18:00.
      operationId: listSchedules
      parameters:
        - { name: employee_id, in: query, schema: { type: string, format: uuid } }
        - name: q
          in: query
          description: Поиск по табельному номеру или ФИО сотрудника
          schema: { type: string }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Графики
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
    post:
      tags: [admin]
      summary: Создать график работы
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "201":
          description: График создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          description: Некорректные данные
        "404":
          description: Сотрудник не найден
        "409":
          description: Сотрудник деактивирован или график пересекается по срокам
  /admin/schedules/bulk:
    post:
      tags: [admin]
      summary: Массово заменить активный график у выбранных сотрудников
      operationId: bulkSchedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ScheduleInput"
                - type: object
                  required: [employee_ids]
                  properties:
                    employee_ids:
                      type: array
                      items: { type: string, format: uuid }
      responses:
        "200":
          description: Отчёт по строкам
  /admin/schedules/{id}:
    patch:
      tags: [admin]
      summary: Изменить график работы
      operationId: updateSchedule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleInput" }
      responses:
        "200":
          description: График сохранён
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400":
          description: Некорректные данные
        "404":
          description: График не найден
        "409":
          description: График пересекается по срокам
    delete:
      tags: [admin]
      summary: Удалить график работы
      operationId: deleteSchedule
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: График удалён
        "404":
          description: График не найден
  /admin/schedules/import:
    post:
      tags: [admin]
      summary: Импорт графиков из CSV (предпросмотр или сохранение)
      description: >
        Колонки: employee_number (обязательна), pattern_type (5/2, 2/2, 4/2, 1/2, custom),
        workdays (1-7; диапазоны 1-5, списки 1,3,5), start_time, end_time,
        valid_from (алиас date_from), valid_to (алиас date_to). По умолчанию:
        pattern_type=5/2, workdays=1-5, start_time=09:00, end_time=18:00,
        valid_from=сегодня (Asia/Novosibirsk). Строки одного сотрудника не должны пересекаться
        по срокам. commit заменяет активный набор графиков сотрудника; активной
        становится запись, действующая на сегодня, иначе ближайшая будущая, иначе
        последняя прошедшая.
      operationId: importSchedules
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [preview, commit], default: preview } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт импорта
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }

  /admin/qr/static:
    post:
      tags: [qr]
      summary: Загрузить статический QR (JSON, подпись при загрузке)
      description: Сервер дополняет payload данными сотрудника, подписывает его и
        отзывает предыдущий активный статический токен сотрудника (ротация).
      operationId: uploadStaticQr
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QrUpload" }
      responses:
        "201":
          description: QR принят
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrToken" }
  /admin/qr/bulk:
    post:
      tags: [qr]
      summary: Массовая загрузка QR (JSON/архив) с предпросмотром и подтверждением
      description: 'Форматы файла: JSON-массив, объект с массивом items, NDJSON
        или ZIP с JSON-файлами. В каждой записи обязателен payload и одно из полей
        employee_id / employee_number. Режим preview не изменяет БД, commit
        создаёт/ротирует статические QR. Максимум 5000 записей.'
      operationId: bulkQr
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [preview, commit], default: preview } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт по строкам
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }
  /admin/qr/employees/bulk:
    post:
      tags: [qr]
      summary: Массово создать личные QR выбранным сотрудникам
      description: >
        Принимает до 500 UUID сотрудников. Для каждого: если активный статический
        QR уже есть — возвращает existing без ротации; если нет — создаёт новый
        (created). Деактивированные и отсутствующие сотрудники попадают в errors.
        Операция идемпотентна по отношению к существующим активным QR.
      operationId: bulkEmployeeQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_ids]
              properties:
                employee_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Отчёт по сотрудникам
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  created: { type: integer }
                  existing: { type: integer }
                  errors: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        employee_id: { type: string, format: uuid }
                        employee_number: { type: string }
                        full_name: { type: string }
                        status: { type: string, enum: [created, existing, error] }
                        qr_id: { type: string, format: uuid, nullable: true }
                        reason: { type: string, nullable: true }
        "400":
          description: Некорректный список или больше 500 сотрудников

  /admin/qr/paper:
    post:
      tags: [qr]
      summary: Выдать бумажный QR-токен (на 1 месяц, Asia/Novosibirsk)
      operationId: issuePaperQr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_id]
              properties:
                employee_id: { type: string, format: uuid }
      responses:
        "201":
          description: Токен выдан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrToken" }
        "409":
          description: У сотрудника уже есть активный бумажный токен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /admin/qr/paper/{id}/revoke:
    post:
      tags: [qr]
      summary: Отозвать бумажный QR-токен
      operationId: revokePaperQr
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Отозван }
  /admin/qr/paper/{id}/pdf:
    get:
      tags: [qr]
      summary: Печатная форма бумажного пропуска 85,6 × 53,98 мм
      description: PDF-карточка 85,6 × 53,98 мм с XMP-метаданными, встроенными
        Unicode-шрифтами, QR-кодом, ФИО, должностью, отделом, местом под фото
        и названием компании из настроек.
      operationId: getPaperQrPdf
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: PDF-документ
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /admin/qr/passes/pdf:
    post:
      tags: [qr]
      summary: Массовая печать бумажных пропусков
      description: Формирует PDF с карточками 85,6 × 53,98 мм по 8 штук на листе A4.
        Если у сотрудника есть действующий бумажный QR, он используется повторно.
      operationId: printPaperPasses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employee_ids]
              properties:
                employee_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: PDF-документ
          headers:
            X-Passes-Printed:
              schema: { type: integer }
            X-Passes-Skipped:
              schema: { type: integer }
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /admin/marks:
    get:
      tags: [admin]
      summary: Отметки с фильтрами
      operationId: listMarks
      parameters:
        - { name: employee_id, in: query, schema: { type: string, format: uuid } }
        - { name: operator_id, in: query, schema: { type: string, format: uuid } }
        - { name: department_id, in: query, schema: { type: string, format: uuid } }
        - { name: position_id, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: Поиск по ФИО или табельному номеру (в интерфейсе — от 3 символов)., schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: outside_office, in: query, schema: { type: boolean } }
        - { name: mock_location, in: query, schema: { type: boolean } }
        - { name: auto_closed_previous, in: query, schema: { type: boolean } }
        - { name: overtime, in: query, schema: { type: boolean } }
        - { name: qr_source, in: query, schema: { type: string, enum: [static, paper] } }
        - { name: client_type, in: query, schema: { type: string, enum: [mobile, web] } }
        - { name: qr_data_mismatch, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Отметки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Mark" }
  /admin/marks/export.csv:
    get:
      tags: [admin, export]
      summary: Экспорт отметок в CSV
      operationId: exportMarksCsv
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: CSV-файл
          content:
            text/csv:
              schema: { type: string }

  /admin/departments:
    get:
      tags: [admin]
      summary: Список отделов
      description: >
        Отдел — элемент справочника для группировки сотрудников и фильтрации
        отметок/отчётов. Содержит UUID, название и признак активности.
        Импорт CSV: колонка name; режимы preview/commit.
      operationId: listDepartments
      responses:
        "200":
          description: Отделы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryItem" }
    post:
      tags: [admin]
      summary: Создать отдел
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectoryInput" }
      responses:
        "201":
          description: Отдел создан
  /admin/departments/import:
    post:
      tags: [admin]
      summary: Импорт отделов из CSV (колонка name)
      operationId: importDepartments
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [preview, commit], default: preview } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт импорта
  /admin/positions:
    get:
      tags: [admin]
      summary: Список должностей
      description: >
        Должность — обязательный справочник для карточки сотрудника в веб-интерфейсе
        и импорта. Содержит UUID, название и признак активности. Свободный текст
        должности в employees больше не используется.
      operationId: listPositions
      responses:
        "200":
          description: Должности
  /admin/positions/import:
    post:
      tags: [admin]
      summary: Импорт должностей из CSV (колонка name)
      operationId: importPositions
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [preview, commit], default: preview } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт импорта
  /admin/offices:
    get:
      tags: [admin]
      summary: Геозоны офисов
      operationId: listOffices
      responses:
        "200":
          description: Офисы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Office" }
    post:
      tags: [admin]
      summary: Создать геозону офиса
      operationId: createOffice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfficeInput" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Office" }

  /admin/offline-imports:
    post:
      tags: [admin, export]
      summary: Загрузить CSV офлайн-импорта отметок
      operationId: uploadOfflineImport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт импорта
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportReport" }

  /admin/oauth/clients:
    get:
      tags: [admin, oauth]
      summary: Список OAuth-клиентов
      operationId: listOAuthClients
      responses:
        "200":
          description: Клиенты
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OAuthClient" }
    post:
      tags: [admin, oauth]
      summary: Создать OAuth-клиента
      operationId: createOAuthClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Клиент создан (секрет показывается один раз)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientCreated" }
  /admin/oauth/clients/{id}:
    patch:
      tags: [admin, oauth]
      summary: Включить или отключить OAuth-клиента
      description: При отключении все выданные клиенту access-токены отзываются.
      operationId: updateOAuthClient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean }
      responses:
        "200":
          description: Состояние изменено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClient" }
        "404":
          description: Клиент не найден
    delete:
      tags: [admin, oauth]
      summary: Удалить OAuth-клиента
      description: Удаляются клиент, его access-токены и IP-whitelist.
      operationId: deleteOAuthClient
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Удалён }
        "404":
          description: Клиент не найден

  /admin/oauth/clients/{id}/rotate:
    post:
      tags: [admin, oauth]
      summary: Ротировать секрет OAuth-клиента
      operationId: rotateOAuthSecret
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Новый секрет
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientCreated" }
  /admin/oauth/clients/{id}/whitelist:
    get:
      tags: [admin, oauth]
      summary: IP-whitelist клиента
      operationId: listIpWhitelist
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Записи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IpWhitelistEntry" }
    post:
      tags: [admin, oauth]
      summary: Добавить CIDR в IP-whitelist клиента
      operationId: addIpWhitelist
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IpWhitelistInput" }
      responses:
        "201":
          description: Добавлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IpWhitelistEntry" }

  /admin/users:
    get:
      tags: [admin]
      summary: Список пользователей
      description: >
        Пользователь — учётная запись для входа (сотрудник, оператор, администратор,
        руководитель смены, директор, отдел кадров). Связан с сотрудником через
        employee_id; логин уникален. Пароль хранится в виде хеша, блокировка
        авторизации и смена роли выполняются отдельными admin-эндпоинтами.
      operationId: listUsers
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [employee, operator, admin, shift_lead, director, hr] } }
        - { name: q, in: query, schema: { type: string, minLength: 3 }, description: Поиск по логину, ФИО или табельному номеру; применяется от 3 символов }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Пользователи
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      tags: [admin]
      summary: Создать пользователя
      description: >
        Создаёт учётную запись с ролью employee, operator, admin, shift_lead,
        director или hr. Для роли employee/operator можно привязать employee_id;
        если логин не передан, для employee он генерируется из ФИО в формате
        ФамилияИ. Пароль проверяется по политике сложности.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, role]
              properties:
                login: { type: string, description: "Обязателен, кроме employee с employee_id и автологином." }
                password: { type: string, minLength: 5 }
                role: { type: string, enum: [employee, operator, admin, shift_lead, director, hr] }
                employee_id: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Пользователь создан
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: Некорректные роль, пароль или привязка к сотруднику }
        "404": { description: Сотрудник не найден }
        "409": { description: Логин уже занят }
  /admin/users/{id}/block:
    post:
      tags: [admin]
      summary: Запретить авторизацию пользователя
      operationId: blockUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Авторизация запрещена }
  /admin/users/{id}/unblock:
    post:
      tags: [admin]
      summary: Разрешить авторизацию пользователя
      operationId: unblockUser
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Авторизация разрешена }
  /admin/users/{id}/role:
    patch:
      tags: [admin]
      summary: Изменить роль пользователя
      operationId: updateUserRole
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [employee, operator, admin, shift_lead, director, hr] }
      responses:
        "200":
          description: Роль изменена
        "409": { description: Главный администратор или последний администратор }
  /admin/users/{id}/reset-registration:
    post:
      tags: [admin]
      summary: Сбросить учётную запись (разрешить повторную регистрацию по QR)
      operationId: resetRegistration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Сброс выполнен }

  /admin/profile:
    get:
      tags: [admin]
      summary: Профиль главного администратора
      operationId: getAdminProfile
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  main_admin_email: { type: string, format: email }
                  support_phone: { type: string }
                  support_email: { type: string, format: email }
                  company_name: { type: string }
                  company_address: { type: string }
                  company_inn: { type: string }
                  website: { type: string }
                  paper_qr_valid_days: { type: integer, minimum: 1, maximum: 365 }
                  default_office_radius_m: { type: integer, minimum: 10, maximum: 10000 }
                  pass_footer: { type: string }
    put:
      tags: [admin]
      summary: Изменить профиль главного администратора
      operationId: updateAdminProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                main_admin_email: { type: string, format: email }
                support_phone: { type: string }
                support_email: { type: string, format: email }
                company_name: { type: string, maxLength: 200 }
                company_address: { type: string, maxLength: 300 }
                company_inn: { type: string, maxLength: 12 }
                website: { type: string, maxLength: 200 }
                paper_qr_valid_days: { type: integer, minimum: 1, maximum: 365 }
                default_office_radius_m: { type: integer, minimum: 10, maximum: 10000 }
                pass_footer: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Обновлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  main_admin_email: { type: string, format: email }
                  support_phone: { type: string }
                  support_email: { type: string, format: email }
                  company_name: { type: string }
                  company_address: { type: string }
                  company_inn: { type: string }
                  website: { type: string }
                  paper_qr_valid_days: { type: integer }
                  default_office_radius_m: { type: integer }
                  pass_footer: { type: string }

  /admin/system-settings:
    get:
      tags: [admin]
      summary: Системные подключения и служебные параметры
      description: >-
        Возвращает параметры SQLite-хранилища настроек, порты сервисов,
        PgBouncer, S3, SSL, статистику демо-базы и рекомендации PostgreSQL.
        Пароли в строках подключения маскируются, секреты S3, пароль Redis
        и приватный ключ QR не возвращаются. Доступно главному администратору.
      operationId: getSystemSettings
      responses:
        "200":
          description: Системные настройки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSettings" }
    put:
      tags: [admin]
      summary: Изменить подключения и параметры инфраструктуры
      description: >-
        Перед сохранением проверяет PostgreSQL и Redis. Можно передать порты,
        PgBouncer, S3, SSL и прямое подключение PostgreSQL. Пустые поля
        не изменяются. Новые подключения и порты применяются после перезапуска
        backend и контейнеров.
      operationId: updateSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConnectionsInput" }
      responses:
        "200":
          description: Сохранено
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/SystemSettings" }
                  - type: object
                    properties:
                      restart_required: { type: boolean }
        "400": { description: Не удалось подключиться к PostgreSQL или Redis }

  /admin/system-settings/test:
    post:
      tags: [admin]
      summary: Проверить подключения PostgreSQL, Redis, S3 и SSL
      description: >-
        Проверяет переданные параметры, а для пустых полей использует текущие.
        PostgreSQL при необходимости создаётся, миграции применяются.
        Дополнительно проверяются S3 endpoint и SSL-сертификат, если они заданы.
      operationId: testSystemSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConnectionsInput" }
      responses:
        "200":
          description: Подключения доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  database: { type: string, enum: [ok] }
                  redis: { type: string, enum: [ok] }
                  database_created: { type: boolean }
        "400": { description: Ошибка подключения }

  /admin/system-settings/test-ssl:
    post:
      tags: [admin]
      summary: Проверить SSL-сертификат
      description: Проверяет пути сертификата и ключа, срок действия и соответствие ключа.
      operationId: testSystemSSL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SSLInput" }
      responses:
        "200":
          description: Сертификат доступен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SSLStatus" }
        "400": { description: Сертификат не найден или недействителен }

  /admin/system-settings/test-s3:
    post:
      tags: [admin]
      summary: Проверить доступность S3
      description: Выполняет запрос к endpoint S3. Ответ 403 также считается доступностью сервиса.
      operationId: testSystemS3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/S3Input" }
      responses:
        "200":
          description: S3 доступен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok] }
                  endpoint: { type: string }
                  http_status: { type: integer }
        "400": { description: S3 недоступен }

  /admin/system-settings/db-scripts:
    get:
      tags: [admin]
      summary: Список SQL-скриптов установки PostgreSQL
      description: Скрипты генерируются из встроенных миграций приложения.
      operationId: listDatabaseScripts
      responses:
        "200":
          description: Список скриптов
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DatabaseScript" }

  /admin/system-settings/db-scripts.zip:
    get:
      tags: [admin]
      summary: Скачать все SQL-скрипты архивом
      operationId: downloadDatabaseScriptsZip
      responses:
        "200":
          description: ZIP-архив скриптов
          content:
            application/zip:
              schema: { type: string, format: binary }

  /admin/system-settings/db-scripts/{name}:
    get:
      tags: [admin]
      summary: Скачать SQL-скрипт
      operationId: downloadDatabaseScript
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Текстовый скрипт
          content:
            text/plain:
              schema: { type: string }
        "404": { description: Скрипт не найден }

  /admin/system-settings/settings-db:
    get:
      tags: [admin]
      summary: Скачать базу настроек SQLite
      description: >-
        Возвращает согласованный снимок settings.db через VACUUM INTO.
        Файл содержит зашифрованные секреты; храните его в защищённом месте.
      operationId: downloadSettingsDatabase
      responses:
        "200":
          description: Снимок SQLite
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }

  /admin/system-settings/migrate-postgres:
    post:
      tags: [admin]
      summary: Перенести базу на другой PostgreSQL
      description: >-
        Использует прямое подключение текущей базы, pg_dump в custom-формате,
        pg_restore с --clean --if-exists --single-transaction и проверку количества
        сотрудников и отметок. Для подтверждения требуется строка MIGRATE.
        Переключение приложения выполняется только при switch_connection=true.
      operationId: migratePostgres
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostgresMigrationInput" }
      responses:
        "200":
          description: Перенос выполнен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PostgresMigrationResult" }
        "400": { description: Неверные параметры или подтверждение }
        "409": { description: Другой перенос уже выполняется }
        "502": { description: Ошибка pg_dump или pg_restore }

  /admin/audit:
    get:
      tags: [admin, audit]
      summary: Журнал аудита
      operationId: listAudit
      parameters:
        - { name: action, in: query, schema: { type: string } }
        - { name: entity_type, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { name: actor_user_id, in: query, schema: { type: string, format: uuid } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Записи аудита
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }

  /export/marks:
    get:
      tags: [export]
      summary: Выгрузка отметок для внешней системы (пагинация по next_cursor)
      operationId: exportMarks
      security:
        - oauth2: []
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 1000 } }
      responses:
        "200":
          description: Страница отметок
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExportMark" }
                  next_cursor: { type: string, nullable: true }
        "401":
          description: Не авторизован
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: IP не в whitelist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /export/ack:
    post:
      tags: [export]
      summary: Подтвердить получение отметок (идемпотентно по mark_id)
      operationId: exportAck
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mark_ids]
              properties:
                mark_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Подтверждено
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged: { type: integer }

  /integration/1c/departments:
    get:
      tags: [integration-1c]
      summary: Справочник отделов для 1С:УПП/ЗУП
      description: >
        OAuth 2.0 (client_credentials). Возвращает все отделы, включая неактивные,
        с UUID, названием и признаком активности. Используется для сопоставления
        подразделений 1С с таблицей departments.
      operationId: integration1cDepartments
      security:
        - oauth2: []
      responses:
        "200":
          description: Отделы
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryItem" }
        "401": { description: Не авторизован }
        "403": { description: IP не в whitelist }
  /integration/1c/positions:
    get:
      tags: [integration-1c]
      summary: Справочник должностей для 1С:УПП/ЗУП
      operationId: integration1cPositions
      security:
        - oauth2: []
      responses:
        "200":
          description: Должности
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DirectoryItem" }
        "401": { description: Не авторизован }
        "403": { description: IP не в whitelist }
  /integration/1c/employees:
    get:
      tags: [integration-1c]
      summary: Сотрудники для 1С:ЗУП/УПП
      description: >
        Постраничная выгрузка сотрудников. Для сопоставления используйте
        employee_number (табельный номер), UUID id и department_id/position_id.
        Поля ФИО отдаются по частям и в виде full_name. Фильтр is_active
        позволяет получать только действующих сотрудников.
      operationId: integration1cEmployees
      security:
        - oauth2: []
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Поиск по ФИО, номеру, телефону, email }
        - { name: is_active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: Сотрудники
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
        "401": { description: Не авторизован }
        "403": { description: IP не в whitelist }
  /integration/1c/schedules:
    get:
      tags: [integration-1c]
      summary: Графики работы для 1С:УПП/ЗУП
      description: >
        Выгрузка графиков. employee_id необязателен; без него возвращаются
        графики всех сотрудников (до 1000). Время трактуется в Asia/Novosibirsk.
      operationId: integration1cSchedules
      security:
        - oauth2: []
      parameters:
        - { name: employee_id, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Графики
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Schedule" }
        "401": { description: Не авторизован }
        "403": { description: IP не в whitelist }
  /integration/1c/marks:
    get:
      tags: [integration-1c]
      summary: Отметки для 1С:УПП/ЗУП
      description: >
        Синоним GET /export/marks для интеграции с 1С. Постраничная выгрузка по
        since и cursor, подтверждение получения через POST /export/ack.
        Возвращает employee_number, ФИО, тип события, серверное/клиентское время,
        источник QR и тип клиента.
      operationId: integration1cMarks
      security:
        - oauth2: []
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 1000 } }
      responses:
        "200":
          description: Страница отметок
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ExportMark" }
                  next_cursor: { type: string, nullable: true }
        "401": { description: Не авторизован }
        "403": { description: IP не в whitelist }

  /oauth/token:
    post:
      tags: [oauth, export]
      summary: Получить access-токен (client_credentials)
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, client_id, client_secret]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                client_id: { type: string }
                client_secret: { type: string }
      responses:
        "200":
          description: Токен доступа
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
        "401":
          description: Неверные client_id/client_secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/employees/import:
    post:
      tags: [admin]
      summary: Импорт сотрудников из CSV (preview/commit)
      operationId: importEmployees
      parameters:
        - { name: mode, in: query, schema: { type: string, enum: [preview, commit], default: preview } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Отчёт об импорте
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows_total: { type: integer }
                  rows_ok: { type: integer }
                  rows_error: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        status: { type: string }
                        reason: { type: string, nullable: true }
  /admin/demo/seed:
    post:
      tags: [admin]
      summary: Загрузить демонстрационные данные (10 сотрудников)
      operationId: seedDemo
      responses:
        "200":
          description: Загружено
          content:
            application/json:
              schema: { type: object, properties: { seeded: { type: integer } } }
  /admin/demo/reset:
    post:
      tags: [admin]
      summary: Полностью заменить базу демонстрационным набором
      description: >-
        Удаляет сотрудников, пользователей (кроме главного администратора),
        отметки, смены, графики, QR, офисы, уведомления, делегирования,
        OAuth-клиентов и журнал аудита, затем создаёт 100 сотрудников
        с номерами н-00000001…н-00000100, 4 графика, данные за 3 месяца,
        QR для всех, демонстрационные уведомления, делегирования, аудит
        и OAuth-клиентов. Пароль всех пользователей — 1й2ц3у.
        Логины сотрудников формируются из ФИО как ФамилияИ; если логин занят,
        добавляются следующие буквы имени (например, ИвановИв, ИвановИва).
      operationId: resetDemo
      responses:
        "200":
          description: Демонстрационная база заменена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoResetResult" }
  /admin/demo/clear:
    post:
      tags: [admin]
      summary: Очистить демонстрационные данные
      operationId: clearDemo
      responses:
        "200":
          description: Удалено
          content:
            application/json:
              schema: { type: object, properties: { removed: { type: integer } } }
  /admin/mobile-builds:
    get:
      tags: [admin]
      summary: Список мобильных сборок
      operationId: listMobileBuilds
      responses:
        "200":
          description: Сборки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MobileBuild" }
    post:
      tags: [admin]
      summary: Загрузить мобильную сборку (.apk/.ipa)
      operationId: uploadMobileBuild
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [platform, version, file]
              properties:
                platform: { type: string, enum: [android, ios] }
                version: { type: string }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Сборка загружена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileBuild" }
  /admin/mobile-builds/{id}:
    delete:
      tags: [admin]
      summary: Удалить мобильную сборку
      operationId: deleteMobileBuild
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Удалено }
        "404": { description: Не найдено }
  /mobile-builds:
    get:
      tags: [public]
      summary: Публичный список активных мобильных сборок
      operationId: publicMobileBuilds
      security: []
      responses:
        "200":
          description: Сборки
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MobileBuild" }
  /mobile-builds/{id}/download:
    get:
      tags: [public]
      summary: Скачать мобильную сборку
      operationId: downloadMobileBuild
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Файл сборки }
        "404": { description: Не найдено }
  /reports/shifts:
    get:
      tags: [reports]
      summary: Отчёт по сменам (роли shift_lead/director/hr/admin)
      operationId: reportShifts
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: employee_id, in: query, schema: { type: string, format: uuid } }
        - { name: employee_ids, in: query, schema: { type: string }, description: "Список UUID через запятую" }
        - { name: employees, in: query, schema: { type: string }, description: "ФИО или табельный номер через запятую" }
        - { name: position, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [json, csv] } }
      responses:
        "200": { description: Смены или CSV }
