components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            export:marks: Выгрузка отметок
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Ключ идемпотентности операции
  schemas:
    SystemSettings:
      type: object
      properties:
        database_url:
          type: string
          description: Строка подключения PostgreSQL с замаскированным паролем
        database_url_set: { type: boolean }
        database_direct_url:
          type: string
          description: Прямое подключение PostgreSQL с замаскированным паролем
        database_direct_url_set: { type: boolean }
        redis_addr: { type: string }
        redis_password_set: { type: boolean }
        qr_private_key_set: { type: boolean }
        qr_public_key: { type: string, description: PEM публичного ключа QR }
        settings_db_path: { type: string }
        settings_db_size: { type: integer, format: int64 }
        app_env: { type: string }
        service_ports: { $ref: "#/components/schemas/ServicePorts" }
        pgbouncer: { $ref: "#/components/schemas/PgBouncerSettings" }
        s3: { $ref: "#/components/schemas/S3Settings" }
        ssl: { $ref: "#/components/schemas/SSLStatus" }
        demo: { $ref: "#/components/schemas/DemoDatabaseStatus" }
        postgres_recommendations:
          type: array
          items: { $ref: "#/components/schemas/PostgresRecommendation" }
    ServicePorts:
      type: object
      properties:
        backend: { type: integer, minimum: 1, maximum: 65535 }
        admin: { type: integer, minimum: 1, maximum: 65535 }
        operator: { type: integer, minimum: 1, maximum: 65535 }
        reports: { type: integer, minimum: 1, maximum: 65535 }
        postgres: { type: integer, minimum: 1, maximum: 65535 }
        pgbouncer: { type: integer, minimum: 1, maximum: 65535 }
        redis: { type: integer, minimum: 1, maximum: 65535 }
        s3_api: { type: integer, minimum: 1, maximum: 65535 }
        s3_admin: { type: integer, minimum: 1, maximum: 65535 }
        https: { type: integer, minimum: 1, maximum: 65535 }
    PgBouncerSettings:
      type: object
      properties:
        host: { type: string }
        port: { type: integer, minimum: 1, maximum: 65535 }
        pool_mode: { type: string, enum: [transaction, session, statement] }
        max_client_conn: { type: integer, minimum: 1 }
        default_pool_size: { type: integer, minimum: 1 }
        auth_type: { type: string }
    S3Settings:
      type: object
      properties:
        endpoint: { type: string }
        region: { type: string }
        bucket: { type: string }
        access_key_set: { type: boolean }
        secret_key_set: { type: boolean }
        use_ssl: { type: boolean }
        path_style: { type: boolean }
    S3Input:
      type: object
      properties:
        endpoint: { type: string }
        region: { type: string }
        bucket: { type: string }
        access_key: { type: string }
        secret_key: { type: string }
        use_ssl: { type: boolean }
        path_style: { type: boolean }
    SSLStatus:
      type: object
      properties:
        cert_path: { type: string }
        key_path: { type: string }
        ready: { type: boolean }
        subject: { type: string }
        issuer: { type: string }
        not_after: { type: string, format: date-time }
        days_left: { type: integer }
        dns_names:
          type: array
          items: { type: string }
        error: { type: string }
        expiring_soon: { type: boolean }
    SSLInput:
      type: object
      properties:
        cert_path: { type: string }
        key_path: { type: string }
    DemoDatabaseStatus:
      type: object
      properties:
        employees: { type: integer, format: int64 }
        marks: { type: integer, format: int64 }
        qr_tokens: { type: integer, format: int64 }
        last_reset: { type: string }
    PostgresRecommendation:
      type: object
      properties:
        name: { type: string }
        value: { type: string }
        note: { type: string }
    DatabaseScript:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        size: { type: integer }
    PostgresMigrationInput:
      type: object
      required: [target_url, confirm]
      properties:
        target_url: { type: string, description: Прямое подключение к целевому PostgreSQL }
        target_runtime_url: { type: string, description: Рабочая строка через PgBouncer; по умолчанию target_url }
        switch_connection: { type: boolean, default: false }
        confirm: { type: string, description: Строка MIGRATE }
    PostgresMigrationResult:
      type: object
      properties:
        status: { type: string, enum: [migrated] }
        switched: { type: boolean }
        employees: { type: integer, format: int64 }
        marks: { type: integer, format: int64 }
        target_url: { type: string }
        restart_required: { type: boolean }
    SystemConnectionsInput:
      type: object
      properties:
        database_url:
          type: string
          description: Новая строка подключения PostgreSQL; пустая — не изменять
        database_direct_url:
          type: string
          description: Новое прямое подключение для pg_dump/pg_restore; пустое — не изменять
        redis_addr:
          type: string
          description: Адрес Redis host:port; пустой — не изменять
        redis_password:
          type: string
          description: Новый пароль Redis; пустой — не изменять
        service_ports: { $ref: "#/components/schemas/ServicePorts" }
        pgbouncer: { $ref: "#/components/schemas/PgBouncerSettings" }
        s3: { $ref: "#/components/schemas/S3Input" }
        ssl: { $ref: "#/components/schemas/SSLInput" }
    DemoResetResult:
      type: object
      properties:
        employees: { type: integer }
        users: { type: integer }
        schedules: { type: integer }
        shifts: { type: integer }
        marks: { type: integer }
        offices: { type: integer }
        notifications: { type: integer }
        delegations: { type: integer }
        audit_records: { type: integer }
        qr_static: { type: integer }
        qr_paper: { type: integer }
        demo_password: { type: string }
        oauth_clients:
          type: array
          items:
            type: object
            properties:
              client_id: { type: string }
              client_secret: { type: string }
              access_token: { type: string }
    MobileBuild:
      type: object
      properties:
        id: { type: string, format: uuid }
        platform: { type: string, enum: [android, ios] }
        version: { type: string }
        filename: { type: string }
        size_bytes: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
    ReadyError:
      type: object
      properties:
        status: { type: string, example: unavailable }
        reason: { type: string, enum: [database, redis, not_configured] }
    BlockedError:
      type: object
      properties:
        error: { type: string }
        support_phone: { type: string }
    SetupStatus:
      type: object
      properties:
        installed: { type: boolean }
        db_configured: { type: boolean }
        db_reachable: { type: boolean }
        redis_configured: { type: boolean }
    SetupParams:
      type: object
      required: [database_url, redis_addr]
      properties:
        database_url: { type: string }
        redis_addr: { type: string }
        redis_password: { type: string }
        main_admin_email: { type: string, format: email }
        support_phone: { type: string }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [employee, operator, admin, shift_lead, director, hr] }
        login: { type: string }
        employee_id: { type: string, format: uuid, nullable: true }
        full_name: { type: string, nullable: true }
        position: { type: string, nullable: true }
        employee_number: { type: string, nullable: true }
    MobileBootstrap:
      type: object
      required: [version, config_version, generated_at, role, role_title, shell, features, navigation, policy]
      properties:
        version: { type: integer, example: 1 }
        config_version: { type: integer, example: 1 }
        generated_at: { type: string, format: date-time }
        role: { type: string, enum: [employee, operator, admin, shift_lead, director, hr] }
        role_title: { type: string, example: Сотрудник }
        shell:
          type: string
          enum: [employee, operator, management, unsupported]
          description: Нативный экранный каркас приложения для роли
        features:
          type: object
          additionalProperties: { type: boolean }
          example: { my_qr: true, monthly_stats: true, profile: true }
        navigation:
          type: array
          items:
            type: object
            required: [key, title, icon]
            properties:
              key: { type: string, example: home }
              title: { type: string, example: Мои отметки }
              icon: { type: string, example: badge }
        policy:
          type: object
          properties:
            cache_until_logout: { type: boolean, example: true }
            refresh_after_sec: { type: integer, example: 86400 }
    MonthlyStats:
      type: object
      properties:
        month: { type: string, example: "2026-10" }
        month_start: { type: string, format: date-time }
        month_end: { type: string, format: date-time }
        days_worked: { type: integer, example: 12 }
        shifts_total: { type: integer, example: 13 }
        shifts_closed: { type: integer, example: 12 }
        worked_minutes: { type: integer, example: 7320 }
        overtime_shifts: { type: integer, example: 1 }
        last_check_ins:
          type: array
          items: { $ref: "#/components/schemas/Mark" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [employee, operator, admin, shift_lead, director, hr] }
        login: { type: string }
        employee_id: { type: string, format: uuid, nullable: true }
        is_locked: { type: boolean }
        auth_blocked: { type: boolean }
        is_main_admin: { type: boolean }
        registered_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        full_name: { type: string, nullable: true }
        employee_number: { type: string, nullable: true }
    Employee:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_number: { type: string }
        full_name: { type: string, description: Формируется автоматически из частей ФИО. }
        last_name: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        middle_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        position: { type: string, nullable: true, description: Название должности из справочника. }
        department_id: { type: string, format: uuid, nullable: true }
        position_id: { type: string, format: uuid, nullable: true }
        is_active: { type: boolean }
        hired_at: { type: string, format: date, nullable: true }
        fired_at: { type: string, format: date, nullable: true }
    EmployeeInput:
      type: object
      required: [employee_number, full_name]
      properties:
        employee_number: { type: string }
        full_name: { type: string, description: Формируется автоматически из частей ФИО. }
        last_name: { type: string, nullable: true }
        first_name: { type: string, nullable: true }
        middle_name: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        department_id: { type: string, format: uuid, nullable: true }
        position_id: { type: string, format: uuid, nullable: true, description: Значение из справочника должностей; в веб-интерфейсе поле обязательно. Свободный текст position больше не принимается. }
        is_active: { type: boolean, default: true }
        hired_at: { type: string, format: date, nullable: true }
        fired_at: { type: string, format: date, nullable: true }
    DirectoryItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_active: { type: boolean }
    DirectoryInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        is_active: { type: boolean, default: true }
    ScheduleInput:
      type: object
      required: [pattern_type, workdays, start_time, end_time, valid_from]
      properties:
        employee_id:
          type: string
          format: uuid
          description: Обязателен при создании; при изменении игнорируется.
        pattern_type: { type: string, enum: ["5/2", "2/2", "4/2", "1/2", custom] }
        workdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        start_time: { type: string, example: "09:00" }
        end_time: { type: string, example: "18:00" }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date, nullable: true }
        is_active: { type: boolean, default: true }
    Schedule:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        pattern_type: { type: string, enum: ["5/2", "2/2", "4/2", "1/2", custom] }
        workdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }
        start_time: { type: string, example: "09:00" }
        end_time: { type: string, example: "18:00" }
        valid_from: { type: string, format: date }
        valid_to: { type: string, format: date, nullable: true }
        is_active: { type: boolean }
        source_file: { type: string, nullable: true }
        employee_number: { type: string, description: Заполняется в списке графиков }
        employee_full_name: { type: string, description: Заполняется в списке графиков }
    MarkCreate:
      type: object
      required: [qr_token, client_type]
      description: >
        event_type необязателен: если у сотрудника есть открытая смена,
        определяется как check_out, иначе как check_in. Явный check_in при
        открытой смене закрывает предыдущую смену автоматически (время закрытия —
        плановое окончание смены, но не позже текущего момента) и создаёт
        уведомление shift.auto_closed.
      properties:
        qr_token: { type: string, format: uuid }
        signature: { type: string }
        event_type:
          type: string
          enum: [check_in, check_out]
          description: Необязателен; при отсутствии определяется по наличию открытой смены.
        client_type: { type: string, enum: [mobile, web] }
        timestamp_client: { type: string, format: date-time }
        lat: { type: number, format: double, nullable: true }
        lon: { type: number, format: double, nullable: true }
        accuracy_m: { type: number, format: double, nullable: true }
        location_age_sec: { type: integer, nullable: true }
        device_os: { type: string, nullable: true }
        device_os_version: { type: string, nullable: true }
        device_model: { type: string, nullable: true }
        app_version: { type: string, nullable: true }
        mock_location: { type: boolean, default: false }
    Mark:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid, nullable: true }
        operator_number: { type: string, nullable: true }
        event_type: { type: string, enum: [check_in, check_out] }
        timestamp_client: { type: string, format: date-time, nullable: true }
        timestamp_server: { type: string, format: date-time }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        mock_location: { type: boolean }
        outside_office: { type: boolean }
        overtime: { type: boolean }
        auto_closed_previous: { type: boolean }
        qr_source: { type: string, enum: [static, paper], nullable: true }
        qr_data_mismatch: { type: boolean }
        client_type: { type: string, enum: [mobile, web], nullable: true }
        shift_id: { type: string, format: uuid, nullable: true }
    ExportMark:
      type: object
      properties:
        mark_id: { type: string, format: uuid }
        employee_number: { type: string }
        employee_full_name: { type: string }
        event_type: { type: string, enum: [check_in, check_out] }
        timestamp_server: { type: string, format: date-time }
        timestamp_client: { type: string, format: date-time, nullable: true }
        operator_number: { type: string, nullable: true }
        qr_source: { type: string, nullable: true }
        client_type: { type: string, nullable: true }
        is_test: { type: boolean }
    QrToken:
      type: object
      properties:
        id: { type: string, format: uuid }
        employee_id: { type: string, format: uuid }
        type: { type: string, enum: [static, paper] }
        token: { type: string, format: uuid }
        signature: { type: string }
        valid_from: { type: string, format: date, nullable: true }
        valid_until: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, revoked, expired] }
        revoked_reason: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
          description: Полная полезная нагрузка, сохранённая в БД
        qr_content:
          type: string
          description: Готовая строка для QR-кода (JSON с token, signature, payload)
    QrUpload:
      type: object
      required: [employee_id, payload]
      properties:
        employee_id: { type: string, format: uuid }
        payload:
          type: object
          additionalProperties: true
        signature: { type: string }
    QrVerification:
      type: object
      properties:
        valid: { type: boolean }
        token_status: { type: string, enum: [active, revoked, expired, not_found] }
        signature_valid: { type: boolean }
        employee_id: { type: string, format: uuid, nullable: true }
        qr_data_mismatch: { type: boolean }
    Delegation:
      type: object
      properties:
        id: { type: string, format: uuid }
        from_user_id: { type: string, format: uuid }
        to_user_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, approved, rejected, revoked, expired] }
        requested_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        decided_by: { type: string, format: uuid, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        body: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true, nullable: true }
        target_user_id: { type: string, format: uuid, nullable: true }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
    Office:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        radius_m: { type: integer, default: 500 }
        is_active: { type: boolean }
    OfficeInput:
      type: object
      required: [name, lat, lon]
      properties:
        name: { type: string }
        lat: { type: number, format: double }
        lon: { type: number, format: double }
        radius_m: { type: integer, default: 500 }
        is_active: { type: boolean, default: true }
    OAuthClient:
      type: object
      properties:
        id: { type: string, format: uuid }
        client_id: { type: string }
        name: { type: string, nullable: true }
        is_active: { type: boolean }
        secret_rotated_at: { type: string, format: date-time, nullable: true }
        next_rotation_at: { type: string, format: date-time, nullable: true }
    OAuthClientCreated:
      allOf:
        - $ref: "#/components/schemas/OAuthClient"
        - type: object
          properties:
            client_secret: { type: string }
    IpWhitelistEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        oauth_client_id: { type: string, format: uuid }
        cidr: { type: string, example: "203.0.113.0/24" }
        description: { type: string, nullable: true }
    IpWhitelistInput:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string }
        description: { type: string }
    AuditEntry:
      type: object
      properties:
        id: { type: integer }
        actor_user_id: { type: string, format: uuid, nullable: true }
        action: { type: string }
        entity_type: { type: string, nullable: true }
        entity_id: { type: string, nullable: true }
        details: { type: object, additionalProperties: true, nullable: true }
        ip: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    ImportReport:
      type: object
      properties:
        rows_total: { type: integer }
        rows_ok: { type: integer }
        rows_error: { type: integer }
        rows:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              status: { type: string, enum: [ok, error] }
              reason: { type: string, nullable: true }

security:
  - bearerAuth: []
