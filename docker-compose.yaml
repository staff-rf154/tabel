name: tabel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Novosibirsk
      PGTZ: Asia/Novosibirsk
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tabel

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "${PGBOUNCER_POOL_SIZE:-40}"
    ports:
      - "${PGBOUNCER_PORT:-6432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tabel

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tabel

  garage:
    image: dxflrs/garage:v1.1.0
    restart: unless-stopped
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    ports:
      - "${S3_API_PORT:-9000}:3900"
      - "${GARAGE_ADMIN_PORT:-9001}:3903"
    networks:
      - tabel

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      TZ: Asia/Novosibirsk
      HTTP_PORT: "8080"
      SETTINGS_DB_PATH: ${SETTINGS_DB_PATH:-/data/settings.db}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: ${REDIS_ADDR}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MOBILE_BUILDS_DIR: ${MOBILE_BUILDS_DIR:-/data/mobile}
    volumes:
      - settings_data:/data
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tabel

  web-admin:
    build:
      context: ./web-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8081}:80"
    volumes:
      - ./templates:/usr/share/nginx/html/templates:ro
    depends_on:
      - backend
    networks:
      - tabel

  web-operator:
    build:
      context: ./web-operator
    restart: unless-stopped
    ports:
      - "${OPERATOR_PORT:-8082}:80"
    depends_on:
      - backend
    networks:
      - tabel

  reports-web:
    build:
      context: ./reports-web
    restart: unless-stopped
    ports:
      - "${REPORTS_PORT:-8083}:80"
    depends_on:
      - backend
    networks:
      - tabel

volumes:
  postgres_data:
  redis_data:
  garage_meta:
  garage_data:
  settings_data:

networks:
  tabel:
    driver: bridge
